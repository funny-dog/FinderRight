name: FinderRight
options:
  bundleIdPrefix: com.finderright
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  developmentLanguage: zh-Hans
  knownRegions:
    - zh-Hans
    - en
    - Base

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

packages:
  FinderRightKit:
    path: FinderRightKit

targets:
  FinderRight:
    type: application
    platform: macOS
    sources:
      - FinderRight
    dependencies:
      - target: FinderRightSync
        embed: true
        codeSign: true
      - target: FinderRightPreview
        embed: true
        codeSign: true
      - target: FinderRightMarkdown
        embed: true
        codeSign: true
      - package: FinderRightKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.finderright.app
        INFOPLIST_FILE: FinderRight/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderRight/FinderRight.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    # 注意：不要在这里写 `info:` block —— xcodegen 会用它生成全新 Info.plist，
    # 覆盖我们手动维护的关键字段（CFBundleURLTypes 等）。Info.plist 由 INFOPLIST_FILE
    # 指定，由我们自己维护。

  FinderRightSync:
    type: app-extension
    platform: macOS
    sources:
      - FinderRightSync
    dependencies:
      - sdk: FinderSync.framework
        embed: false
      - package: FinderRightKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.finderright.app.sync
        INFOPLIST_FILE: FinderRightSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderRightSync/FinderRightSync.entitlements
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    # 同上：不要 `info:` block。NSExtension 字段必须在 Info.plist 中手动保留，
    # 否则 FinderSync 扩展不被 macOS 识别 → pluginkit 不显示 → 右键无菜单。

  FinderRightPreview:
    type: app-extension
    platform: macOS
    sources:
      - FinderRightPreview
    dependencies:
      - sdk: QuickLookUI.framework
        embed: false
      - sdk: AppKit.framework
        embed: false
      - package: FinderRightKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.finderright.app.preview
        PRODUCT_MODULE_NAME: FinderRightPreview
        INFOPLIST_FILE: FinderRightPreview/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderRightPreview/FinderRightPreview.entitlements
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"

  FinderRightMarkdown:
    type: app-extension
    platform: macOS
    sources:
      - FinderRightMarkdown
      - path: FinderRightPreview/DocumentPreviewView.swift
    dependencies:
      - sdk: QuickLookUI.framework
        embed: false
      - sdk: AppKit.framework
        embed: false
      - package: FinderRightKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.finderright.app.markdown
        PRODUCT_MODULE_NAME: FinderRightMarkdown
        INFOPLIST_FILE: FinderRightMarkdown/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderRightMarkdown/FinderRightMarkdown.entitlements
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
