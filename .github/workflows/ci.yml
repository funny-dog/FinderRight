name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 优先用仓库自托管的 macOS runner（本机常驻），GitHub 托管机不可用时也能跑。
    # 若自托管 runner 不可用，可在仓库 Settings → Actions 里改回 macos-15。
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 工具链版本
        run: swift --version
      - name: 编译 Kit、单元测试、主 App 与扩展类型检查
        run: bash scripts/ci.sh
