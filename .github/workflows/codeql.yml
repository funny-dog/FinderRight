name: CodeQL

on:
  push:
    branches: [master]
    paths:
      - 'FinderRight/**'
      - 'FinderRightKit/**'
      - 'FinderRightSync/**'
      - 'FinderRightPreview/**'
      - 'FinderRight.xcodeproj/**'
      - 'project.yml'
      - '.github/workflows/**'
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
            build-mode: none
          - language: swift
            os: macos-15
            build-mode: manual
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build app and extensions for Swift analysis
        if: matrix.language == 'swift'
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -scheme FinderRight -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/codeql \
            ARCHS=arm64 SWIFT_VERSION=5 CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
